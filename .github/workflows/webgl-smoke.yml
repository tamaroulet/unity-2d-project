name: WebGL Smoke Test

# WebGL ビルドがブラウザで実際に動作することを機械で検証する
# 手動トリガーではなく、main への push で自動実行する
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: webgl-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Game/Library
          key: Library-Game-WebGL-${{ hashFiles('Game/Packages/packages-lock.json', 'Game/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Game-WebGL-
            Library-Game-

      - name: Build WebGL
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Game
          unityVersion: 6000.3.23f1
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build-${{ github.sha }}
          path: build/WebGL
          retention-days: 1

  smoke-test:
    name: Run WebGL Smoke Test
    needs: build-webgl
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.50.0-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: webgl-build-${{ github.sha }}
          path: build/WebGL

      - name: Install Python dependencies
        run: |
          pip install playwright==1.50.0 pillow

      - name: Run WebGL Smoke Test (playwright)
        timeout-minutes: 10 # 待ち時間の上限（超過時は失敗）
        run: |
          python scripts/run_webgl_smoke.py --build-dir build/WebGL --timeout 180 --play-duration 5

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-smoke-artifacts-${{ github.sha }}
          path: |
            smoke_screenshot.png
            browser_logs.json
          if-no-files-found: ignore
          retention-days: 7
